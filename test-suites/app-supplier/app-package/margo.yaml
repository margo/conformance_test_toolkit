apiVersion: v1
id: com-northstartida-otel-app
metadata:
  name: otel-app
  description: A basic OpenTelemetry application
  version: "1.0"
  catalog:
    application:
      icon: ./resources/opentelemtry-logo.png
      tagline: Northstar Industrial Application's OpenTelemetry application.
      descriptionFile: ./resources/description.md
      releaseNotes: ./resources/release-notes.md
      licenseFile: ./resources/license.txt
      site: http://www.northstar-ida.com
      tags: ["monitoring"]
    author:
      - name: Roger Wilkershank
        email: rpwilkershank@northstar-ida.com
    organization:
      - name: Northstar Industrial Applications
        site: http://northstar-ida.com
deploymentProfiles:
  - type: helm
    id: otel-demo
    components:
      - name: otel-app
        properties:
          repository: oci://harbor.machine:8443/library/custom-otel-helm
          revision: 0.1.0
          wait: true
parameters:
  otlpEndpoint:
    value: "http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318"
    targets:
    # Maps to the chart value env.OTEL_EXPORTER_OTLP_ENDPOINT,
    # e.g., helm install ... --set env.OTEL_EXPORTER_OTLP_ENDPOINT="http://..."
    - pointer: env.OTEL_EXPORTER_OTLP_ENDPOINT
      components: ["otel-app"]
configuration:
  sections:
    - name: Observability Settings
      settings:
        - parameter: otlpEndpoint
          name: Endpoint of the OTLP collector
          description: Endpoint of the OTLP collector
          schema: endpoint
  schema:
    - name: endpoint
      dataType: string
      allowEmpty: false
