# Margo CTT in two containers:
#   ctt-test-suites  copies the test-suites into the shared volume, then exits
#   ctt-runner       CTT code + tools + the CTT's own OCI registry (Zot); stays running
#
# Usage (from this folder):
#   CTT_REGISTRY_HOST=<IP or name of this host> docker compose up -d --build
#   docker compose exec ctt-runner bash ctt-runner/ctt-start.sh
#
# Everything the CTT creates or needs from you is under ./ctt-data on the host.
name: margo-ctt

services:
  ctt-test-suites:
    build:
      context: ..
      dockerfile: container/Dockerfile.test-suites
    image: margo-ctt-test-suites:dev
    volumes:
      - test-suites:/shared

  ctt-runner:
    build:
      context: ..
      dockerfile: container/Dockerfile.runner
    image: margo-ctt-runner:dev
    depends_on:
      ctt-test-suites:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      # Address that clients outside the container use for the registry
      # (goes into the registry's TLS certificate).
      CTT_REGISTRY_HOST: ${CTT_REGISTRY_HOST:-localhost}
      CTT_REGISTRY_USER: ${CTT_REGISTRY_USER:-ctt}
      CTT_REGISTRY_PASSWORD: ${CTT_REGISTRY_PASSWORD:-margo-ctt}
      # Application Package used by the WFM Supplier registry checks.
      REGISTRY_REF: ${REGISTRY_REF:-127.0.0.1:5443/library/margo-ctt-hello-world:1.0.0}
    ports:
      - "${CTT_REGISTRY_PORT:-5443}:5443"   # CTT registry (Zot)
      - "3001:3001"                         # Device Supplier mock WFM
    volumes:
      - test-suites:/ctt/test-suites:ro
      # Registry data: CA (zot/certs/ca.crt for clients), server certificate, storage,
      # audit log. Put extra CAs to trust (e.g. a vendor registry's CA) in trusted-ca/*.crt.
      - ./ctt-data:/ctt-data
      # Put the SVID files here (e.g. client-svid-cert.pem, client-svid-key.pem, mis-ca.crt)
      # and give /input to "Setup MIAF Identity".
      - ./ctt-data/input:/input
      # Kept across container restarts: installed identities, signing CA, reports
      - ./ctt-data/wfm-identity:/ctt/ctt-runner/wfm-supplier/utils/fixtures/miaf/real
      - ./ctt-data/device-certs:/ctt/ctt-runner/device-supplier/certs
      - ./ctt-data/signing-identity:/ctt/ctt-runner/reports/scripts/signing-identity
      - ./ctt-data/reports:/ctt/ctt-runner/reports/wfm-supplier
      - ./ctt-data/reports-device:/ctt/ctt-runner/reports/device-supplier
      - ./ctt-data/reports-application:/ctt/ctt-runner/reports/application-supplier

volumes:
  test-suites:
