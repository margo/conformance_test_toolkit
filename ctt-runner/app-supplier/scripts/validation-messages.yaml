apiVersion:
  crId: MARGO-APP-APPDESC-001
  check:
    datatype: string
    expected: v1

  pass:
    description: API version conforms to the required specification.

  fail:
    missing: API version is required but was not provided.
    invalid: API version MUST be v1.

id:
  crId: MARGO-APP-APPDESC-002, MARGO-APP-APPDESC-048, MARGO-APP-APPDESC-049
  check:
    datatype: string
    expected: lowercase letters, numbers and dashes only, max length=200

  pass:
    description: Application identifier conforms to the required naming convention.

  fail:
    missing: Application identifier is required but was not provided.
    invalid: Application identifier does not conform to the required naming convention.

metadata.name:
  crId: MARGO-APP-APPDESC-005
  check:
    datatype: string
    expected: Required (non-empty)

  pass:
    description: Application name conforms to the required specification.

  fail:
    missing: Application name is required but was not provided.
    invalid: Application name does not conform to the required naming convention.

metadata.version:
  # MARGO-APP-APPLICATIONREGISTRY-002 (tag == metadata.version) is judged by
  # the Application Registry check (registry.go), not by this presence check.
  crId: MARGO-APP-APPDESC-006
  check:
    datatype: string
    expected: Required (non-empty)

  pass:
    description: Application version conforms to the required specification.

  fail:
    missing: Application version is required but was not provided.
metadata.catalog.organization:
  crId: MARGO-APP-APPDESC-008
  check:
    datatype: array
    expected: At least one organization

  pass:
    description: Organization information conforms to the required specification.

  fail:
    missing: At least one organization definition is required.

metadata.catalog.organization.name:
  crId: MARGO-APP-APPDESC-009
  check:
    datatype: string
    expected: Required (non-empty)

  pass:
    description: Organization information conforms to the required specification.

  fail:
    missing: Organization name is required but was not provided.

deploymentProfiles:
  crId:
  check:
    datatype: array
    expected: At least one deployment profile

  pass:
    description: Deployment profile configuration conforms to the required baseline.

  fail:
    missing: At least one deployment profile is required.

deploymentProfiles.type:
  crId: MARGO-APP-APPDESC-010
  check:
    datatype: string
    expected: helm | compose

  pass:
    description: Deployment profile type conforms to the supported deployment specifications.

  fail:
    missing: Deployment profile type is required but was not provided.
    invalid: Deployment profile type does not conform to the supported deployment specifications.

deploymentProfiles.id:
  crId: MARGO-APP-APPDESC-011
  check:
    datatype: string
    expected: Required (non-empty)

  pass:
    description: Deployment profile configuration conforms to the defined specification.

  fail:
    missing: Deployment profile identifier is required but was not provided.

deploymentProfiles.components:
  crId: MARGO-APP-APPDESC-012
  check:
    datatype: array
    expected: At least one component definition

  pass:
    description: Component configuration conforms to the defined specification.

  fail:
    missing: Deployment profile does not contain any component definitions.

deploymentProfiles.components.name:
  crId: MARGO-APP-APPDESC-030,MARGO-APP-APPDESC-053
  check:
    datatype: string
    expected: Required (non-empty)

  pass:
    description: Component configuration conforms to the defined specification.

  fail:
    missing: Component name is required but was not provided.

deploymentProfiles.components.properties:
  crId: MARGO-APP-APPDESC-031
  check:
    datatype: map
    expected: Component properties required

  pass:
    description: Component properties conform to the deployment requirements.

  fail:
    missing: Component configuration properties are not defined.

deploymentProfiles.components.properties.repository:
  crId: MARGO-APP-APPDESC-032
  check:
    datatype: string
    expected: Repository URL required

  pass:
    description: Repository configuration conforms to the deployment requirements.

  fail:
    missing: Repository configuration is required but was not provided.

deploymentProfiles.components.properties.revision:
  crId: MARGO-APP-APPDESC-033
  check:
    datatype: string
    expected: Valid SemVer 2.0 without leading v

  pass:
    description: Component revision conforms to the required SemVer specification.

  fail:
    missing: Revision information is required but was not provided.
    invalid: Component revision must be a valid SemVer 2.0 string without a leading v.

configuration.schema.name:
  crId: MARGO-APP-APPDESC-041
  check:
    datatype: string
    expected: Schema name required

  pass:
    description: Schema conforms to the defined specification.

  fail:
    missing: Schema name is required but was not provided.

configuration.schema.dataType:
  crId: MARGO-APP-APPDESC-041
  check:
    datatype: string
    expected: string | integer | double | boolean | array[string] | array[integer] | array[double] | array[boolean]

  pass:
    description: Schema data type conforms to the specification.

  fail:
    missing: Schema data type is required but was not provided.
    invalid: Schema data type is not one of the supported Margo data types.

configuration.sections.settings.parameter:
  crId: MARGO-APP-APPDESC-040
  check:
    datatype: reference
    expected: Must match a parameter definition

  pass:
    description: Parameter conforms to the defined specification.

  fail:
    invalid: Referenced parameter is not defined.

configuration.sections.settings.schema:
  crId: MARGO-APP-APPDESC-039
  check:
    datatype: reference
    expected: Must match a schema definition

  pass:
    description: Schema conforms to the defined specification.

  fail:
    invalid: Referenced schema is not defined.

parameters.targets.components:
  crId: MARGO-APP-APPDESC-035, MARGO-APP-APPDESC-037
  check:
    datatype: reference
    expected: Must match a deployment component

  pass:
    description: Parameter conforms to the defined component mapping requirements.

  fail:
    invalid: Parameter references a component that does not conform to the defined deployment configuration.

parameters.targets.pointer:
  crId: MARGO-APP-APPDESC-036
  check:
    datatype: string
    expected: Required (non-empty)

  pass:
    description: Parameter target pointer conforms to the defined component mapping requirements.

  fail:
    missing: Parameter target pointer is required but was not provided.

deploymentProfiles.deviceConstraints.capacityRequirements.cpu.cores:
  crId: MARGO-APP-APPDESC-013
  check:
    datatype: number
    expected: Required when cpu is present

  pass:
    description: CPU core requirements conform to the device constraint specification.

  fail:
    missing: CPU cores are required when capacityRequirements.cpu is defined.

propertySelector.matchExpressions.key:
  crId: MARGO-APP-APPDESC-014
  check:
    datatype: string
    expected: RFC6901 JSON Pointer

  pass:
    description: Property selector key conforms to the RFC6901 JSON Pointer format.

  fail:
    missing: Property selector key is required but was not provided.
    invalid: Property selector key is not a valid RFC6901 JSON Pointer.

propertySelector.matchExpressions:
  crId: MARGO-APP-APPDESC-018
  check:
    datatype: array
    expected: At least one match expression

  pass:
    description: Property selector contains valid match expressions.

  fail:
    missing: Property selector must define one or more match expressions.
    invalid: Property selector does not contain the required match expressions.